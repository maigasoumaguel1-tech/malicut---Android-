name: MaliCut Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Set Android API 36
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MaliCut-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
