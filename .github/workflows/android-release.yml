name: MaliCut Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 16 API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dependances
        run: npm ci

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer la version MaliCut
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(r'versionCode\s+\d+', 'versionCode 8', s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "8.0.0"', s, count=1)

          p.write_text(s)
          PY

      - name: Decoder la cle de signature
        env:
          MALICUT_KEYSTORE_BASE64: ${{ secrets.MALICUT_KEYSTORE_BASE64 }}
        run: |
          echo "$MALICUT_KEYSTORE_BASE64" | base64 --decode > android/app/malicut-upload.jks

      - name: Configurer la signature
        env:
          MALICUT_KEYSTORE_PASSWORD: ${{ secrets.MALICUT_KEYSTORE_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("MALICUT_KEYSTORE_FILE"))
                      storePassword System.getenv("MALICUT_KEYSTORE_PASSWORD")
                      keyAlias "malicut-upload"
                      keyPassword System.getenv("MALICUT_KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Construire AAB et APK
        env:
          MALICUT_KEYSTORE_FILE: ${{ github.workspace }}/android/app/malicut-upload.jks
          MALICUT_KEYSTORE_PASSWORD: ${{ secrets.MALICUT_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Publier les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: malicut-android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
